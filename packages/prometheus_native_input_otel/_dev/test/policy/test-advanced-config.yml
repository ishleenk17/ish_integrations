vars:
  scrape_configs: |
    - job_name: node-exporter
      scrape_interval: 15s
      honor_labels: true
      static_configs:
        - targets:
            - node-a:9100
            - node-b:9100
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: go_memstats_.*
          action: drop
    - job_name: kube-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
