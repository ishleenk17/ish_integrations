format_version: 3.5.0
name: prometheus_native_input_otel
title: "Prometheus Scrape (Native Schema)"
version: 0.1.0
source:
  license: "Elastic-2.0"
description: "Scrape Prometheus-format metrics via the OTel Collector and store them with Prometheus metric names and labels preserved, so PromQL queries work unmodified."
type: input
group: prometheus
categories:
  - monitoring
  - observability
  - opentelemetry
conditions:
  kibana:
    version: "^9.2.0"
  elastic:
    subscription: "basic"
icons:
  - src: /img/logo_prometheus_otel.svg
    title: Prometheus OpenTelemetry logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: prometheus_native
    type: metrics
    title: Prometheus Metrics (Native Schema)
    description: Scrape Prometheus endpoints and keep metric names and labels queryable by PromQL
    input: otelcol
    template_path: input.yml.hbs
    vars:
      # ---------------------------------------------------------------- job
      # job_name becomes resource.attributes["service.name"], which this package
      # restores to the `job` label. A fixed value would collapse every target
      # into one series for `sum by (job)` queries, so it must be user-set.
      - name: job_name
        type: text
        title: Job Name
        required: true
        default: prometheus
        description: >
          Prometheus job name for these targets. This is preserved as the `job` label,
          so use the same value your existing dashboards and alert rules group by.
        show_user: true
      - name: targets
        type: text
        title: Scrape Targets
        required: false
        multi: true
        description: List of scrape targets in host:port format (e.g. localhost:9090). The metrics path is configured separately.
        default:
          - localhost:9090
        show_user: true
      - name: scrape_interval
        type: duration
        title: Scrape Interval
        required: false
        description: How frequently to scrape targets
        default: 60s
        show_user: true
      - name: scrape_timeout
        type: duration
        title: Scrape Timeout
        required: false
        description: Timeout for scraping (must be less than the scrape interval)
        default: 10s
        show_user: false
      - name: metrics_path
        type: text
        title: Metrics Path
        required: false
        description: The HTTP resource path to fetch metrics from targets
        default: /metrics
        show_user: false
      - name: scheme
        type: select
        title: Scheme
        required: false
        description: Protocol scheme to use for scraping
        default: http
        show_user: false
        options:
          - text: HTTP
            value: http
          - text: HTTPS
            value: https
      # ------------------------------------------------------ label fidelity
      - name: honor_labels
        type: bool
        title: Honor Labels
        required: false
        description: >
          Keep labels exposed by the target when they collide with labels added by the
          scraper. Enabled by default so that federated or pushed metrics retain their
          original `job` and `instance` values.
        default: true
        show_user: false
      - name: honor_timestamps
        type: bool
        title: Honor Timestamps
        required: false
        description: Use timestamps reported by the target rather than the scrape time
        default: true
        show_user: false
      # ------------------------------------------------------- relabel rules
      - name: relabel_configs
        type: yaml
        title: "Relabel Configs"
        required: false
        description: >
          Prometheus `relabel_configs`, applied to targets before scraping. Use this to
          rewrite or attach labels such as `cluster` or `env` that your dashboards group by.
          Paste the list exactly as it appears in prometheus.yml.
        show_user: false
      - name: metric_relabel_configs
        type: yaml
        title: "Metric Relabel Configs"
        required: false
        description: >
          Prometheus `metric_relabel_configs`, applied after scraping. This is the standard
          way to drop high-cardinality or unwanted metrics before they are stored.
        show_user: false
      # ------------------------------------------------------ authentication
      - name: tls_enabled
        type: bool
        title: Enable TLS Configuration
        required: false
        description: Enable TLS configuration for HTTPS endpoints
        default: false
        show_user: true
      - name: tls_skip_verify
        type: bool
        title: Skip TLS Verification
        required: false
        description: Skip verification of the server certificate (use for self-signed certificates)
        default: false
        show_user: true
      - name: tls_ca_file
        type: text
        title: CA Certificate Path
        required: false
        description: Path to the CA certificate file for verifying the server
        show_user: true
      - name: tls_cert_file
        type: text
        title: Client Certificate Path
        required: false
        description: Path to the client certificate file for mutual TLS authentication. Must be used together with Client Key Path.
        show_user: false
      - name: tls_key_file
        type: text
        title: Client Key Path
        required: false
        description: Path to the client private key file for mutual TLS authentication. Must be used together with Client Certificate Path.
        show_user: false
      - name: username
        type: text
        title: Username
        required: false
        description: Username for basic authentication. When set, basic auth is used and Bearer Token is ignored.
        show_user: true
      - name: password
        type: password
        title: Password
        required: false
        # TODO: Change to secret: true once Fleet Server resolves the secret handling issue
        # for OTel input packages. See: https://github.com/elastic/fleet-server/issues/6277
        secret: false
        description: Password for basic authentication. Must be used together with Username.
        show_user: true
      - name: bearer_token
        type: password
        title: Bearer Token
        required: false
        # TODO: Change to secret: true once Fleet Server resolves the secret handling issue
        # for OTel input packages. See: https://github.com/elastic/fleet-server/issues/6277
        secret: false
        description: Bearer token sent as Authorization Bearer credentials. Ignored when Username is set.
        show_user: true
      # ------------------------------------------------- advanced escape hatch
      - name: scrape_configs
        type: yaml
        title: "Advanced: Full Scrape Configuration"
        required: false
        description: >
          Paste `scrape_configs` from an existing prometheus.yml to use it verbatim. This
          supports multiple jobs, service discovery (`kubernetes_sd_configs`, `ec2_sd_configs`,
          `file_sd_configs`) and relabeling. When set, this REPLACES every guided field above.
          Leave empty to use the guided configuration.
        show_user: false
owner:
  github: elastic/obs-infraobs-integrations
  type: elastic
